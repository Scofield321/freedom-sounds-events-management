<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freedom Sounds & Events Management</title>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 py-2">
      <a class="navbar-brand" href="index.html">
        Freedom Sounds & Events Mgt
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Instruments Shop</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="sound-services.html">Sound Engineering</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="advertising.html">Advertising / Drive</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="training.html">Training</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- CAROUSEL BANNER -->
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner" id="carouselContainer">
        <!-- Dynamic banners will be injected here -->
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- PRODUCT LIST -->
    <section class="products-section">
      <h2 class="section-title" id="productsTitle">Featured Instruments</h2>
      <!-- Search bar -->
      <div class="search-bar-wrapper d-lg-block">
        <div class="search-bar">
          <i class="bi bi-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search instruments..."
          />
        </div>
      </div>

      <div id="loader" class="loader"></div>
      <div class="products-grid" id="productsContainer">
        <!-- Dynamic products will be loaded here -->
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
