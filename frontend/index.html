<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freedom Sounds & Events Management</title>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar bg-dark px-3 py-2">
      <h2 class="site-title text-white m-0">
        Freedom Sounds & Events Management
      </h2>

      <div class="search-bar-wrapper">
        <input
          type="text"
          id="searchInput"
          placeholder="Search instruments..."
          class="form-control"
        />
      </div>
    </nav>

    <!-- CAROUSEL BANNER -->
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner" id="carouselContainer">
        <!-- Dynamic banners will be injected here -->
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- PRODUCT LIST -->
    <section class="products-section">
      <h2 class="section-title" id="productsTitle">Featured Instruments</h2>
      <div id="loader" class="loader"></div>
      <div class="products-grid" id="productsContainer">
        <!-- Dynamic products will be loaded here -->
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
